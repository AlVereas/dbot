[package]
name = "dbot"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.12.5", features = ["client", "gateway", "rustls_backend", "model"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
